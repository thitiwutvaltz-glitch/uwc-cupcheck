<style>

.rxp{display:flex;gap:8px;flex-wrap:wrap}.rxp .ph{width:72px;height:72px;border-radius:10px;background:#eef1f5 center/cover;position:relative}.rxp .ph b{position:absolute;inset:auto 0 0 0;font-size:11px;text-align:center;background:#0008;color:#fff;border-radius:0 0 10px 10px}

.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:9px 13px;font:inherit;font-size:15px;color:var(--ink)}.chip.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}.nmhit{cursor:pointer}.nmadd{width:100%;font-size:17px;padding:13px;border-style:dashed}
.mtabs{display:flex;gap:5px;padding:8px 12px 0}.mtabs button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:6px 2px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;line-height:1.25;color:var(--ink)}.mtabs button b{display:block;font-size:18px}.mtabs button.on{border-color:var(--pri);background:var(--pri);color:#fff}.mtabs button.rx.on{border-color:#2563a8;background:#2563a8}
.rxmenu{display:flex;flex-direction:column;gap:10px;margin:12px}.rxmenu button{display:flex;align-items:center;gap:12px;border:0;border-radius:16px;padding:16px;font:inherit;text-align:left;cursor:pointer}.rxmenu button .ic{font-size:28px;width:36px;text-align:center}.rxmenu button b{display:block;font-size:18px}.rxmenu button small{font-size:14px;opacity:.85}.rxmenu .m1{background:#e3f4ec;color:#0b5c3f}.rxmenu .m2{background:#e6f0fb;color:#174a7c}.rxmenu .m3{background:#fdf1dc;color:#7a4b06}.rxmenu .m4{background:#f1f2f5;color:#3d4554}.rxmenu .cnt{margin-left:auto;background:#fff;border-radius:20px;padding:2px 9px;font-size:13px;font-weight:700}
.lnk{background:none;border:0;color:var(--pri);font:inherit;font-size:14px;font-weight:600;padding:6px 0;cursor:pointer;text-decoration:underline}
.rxn{width:100%;box-sizing:border-box;border:1.5px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:15px}
.phb{border:1.5px solid var(--line);background:#fff;border-radius:10px;font-size:18px;padding:6px 9px;margin-left:6px;cursor:pointer}
.modebar{display:flex;gap:6px;padding:10px 12px 0}.modebar button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px 4px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}.modebar button.on{border-color:var(--pri);background:var(--pri);color:#fff}.modebar .arr{align-self:center;color:#98a2b3;font-size:20px}.modebar.rxbar{padding-top:6px}.modebar.rxbar button.on{border-color:#2563a8;background:#2563a8}.modebar small{font-weight:400;font-size:12px}

.list{padding:10px 12px;display:flex;flex-direction:column;gap:10px}

.dn{font-weight:700}

.nb{height:48px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font:inherit;font-size:19px;font-weight:600;cursor:pointer;color:var(--ink)}

.other{display:none;align-items:center;gap:10px;margin-top:8px}.other.show{display:flex}

.photo{width:100%;max-height:320px;object-fit:cover;border-radius:12px;display:block;margin-bottom:8px}

.btn.sec2{background:var(--pri-2);color:var(--pri);width:100%}
.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn.main{width:100%;background:var(--ok);color:#fff;font-size:19px}
.btn.main:disabled{background:#c7ced8}
.bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(14px + env(safe-area-inset-bottom));z-index:6}
.hint{font-size:13px;color:var(--warn);text-align:center;margin-bottom:6px;min-height:18px}
.res{margin:14px 12px;border-radius:16px;padding:20px 16px;text-align:center}
.res.ok{background:var(--ok-bg);color:var(--ok)}.res.bad{background:var(--bad-bg);color:var(--bad)}
.res .big{font-size:42px;line-height:1}.res h2{margin:8px 0 4px;font-size:22px}.res p{margin:4px 0;color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:13px;color:var(--muted);font-weight:600}td.n{text-align:center;font-weight:700}
tr.x td{background:var(--bad-bg)}
.note{font-size:13px;color:var(--muted);margin:8px 14px}
.names{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.names button{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:14px 8px;font:inherit;font-size:16px;font-weight:600;cursor:pointer}
.names button.on{border-color:var(--pri);background:var(--pri-2);color:var(--pri)}
.modal{position:fixed;inset:0;background:rgba(15,20,30,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.show{display:flex}
.sheet{background:#fff;width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 6px}.acts{display:flex;gap:8px;margin-top:14px}.acts .btn{flex:1}
.err{background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:10px 12px;margin:10px 12px;font-size:14px}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--pri);border-radius:50%;animation:s 1s linear infinite;margin:0 auto 10px}
@keyframes s{to{transform:rotate(360deg)}}
.pd{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.pd:first-of-type{border-top:0}
.pd .q{min-width:64px;height:56px;border-radius:12px;background:var(--pri-2);color:var(--pri);font-size:26px;font-weight:800;display:flex;align-items:center;justify-content:center}
.pd .q small{font-size:12px;font-weight:600;margin-left:3px}
.pd .t{flex:1;min-width:0}.pd .ck{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff}
.pd.on .ck{background:var(--ok);border-color:var(--ok)}.pd.on .q{background:var(--ok-bg);color:var(--ok)}
.pd .fix{font-size:13px;color:var(--bad);background:var(--bad-bg);border-radius:8px;padding:3px 8px;margin-top:4px;display:inline-block}
.rxr{gap:12px}.rxr .rm{width:52px;height:52px;border-radius:12px;background:var(--pri-2);color:var(--pri);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:17px;line-height:1.1;flex:none}.rxr .rm small{font-size:10px;font-weight:600}
.rxr .lowb{background:var(--warn-bg);color:var(--warn);font-size:13px;font-weight:700;border-radius:20px;padding:3px 9px;white-space:nowrap}.rxr .chev{font-size:24px;color:#98a2b3}
.rxf{display:flex;gap:8px;margin:10px 12px 0}.rxf button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:8px 6px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}.rxf button.on{background:var(--pri);border-color:var(--pri);color:#fff}.rxf button.on.warn{background:var(--warn);border-color:var(--warn)}
.rxst{display:flex;margin:10px 12px 0;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px}.rxst div{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;color:var(--muted);font-weight:600}.rxst i{font-style:normal;width:22px;height:22px;border-radius:50%;border:1.5px solid #c4ccd8;display:flex;align-items:center;justify-content:center;font-size:12px}.rxst .done{color:var(--ok)}.rxst .done i{background:var(--ok);border-color:var(--ok);color:#fff}
.rxg{margin:14px 16px 0;font-size:14px;font-weight:700;color:var(--muted)}.rxg.warn{color:var(--warn)}
.rxh{display:flex;gap:10px;align-items:flex-start}
.bal{min-width:86px;border-radius:12px;padding:6px 8px;text-align:center;display:flex;flex-direction:column;line-height:1.15;flex:none}.bal b{font-size:26px;font-weight:800}.bal small{font-size:11.5px;font-weight:600}
.bal.ok{background:var(--ok-bg);color:var(--ok)}.bal.warn{background:var(--warn-bg);color:var(--warn)}.bal.bad{background:var(--bad-bg);color:var(--bad)}.bal.na{background:#f1f3f6;color:var(--muted)}
.rxq .lb{font-size:14px;color:var(--muted);font-weight:600;margin-right:2px}.rxq .pm{width:44px;height:44px;font-size:22px;padding:0;line-height:1}.rxq input{height:44px}.rxq .un{color:var(--muted)}
.rxc{display:flex;gap:6px;margin-top:8px}.rxc button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;font:inherit;font-weight:700;font-size:15px;padding:8px 4px;cursor:pointer}.rxc .clr{color:var(--bad);flex:.8}
.rxa{margin-top:10px;background:var(--ok-bg);color:var(--ok);border-radius:10px;padding:8px 10px;font-size:15px}.rxa small{color:var(--muted)}
.btn.cam{display:block;background:var(--pri)}
</style>

<body>
<div class="app" id="app"><div class="center"><div class="spin"></div>กำลังเปิด…</div></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<script src="config.js?v=3"></script>
<script>
const C = window.CUPCHECK_CONFIG || {};
const QS = new URLSearchParams(location.search); (()=>{ const st = QS.get('liff.state'); if (st){ try{ new URLSearchParams(decodeURIComponent(st).replace(/^[^?]*\?/,'')).forEach((v,k)=>{ if(!QS.has(k)) QS.set(k,v); }); }catch(e){} } })(); const BR_TH = {Srinakarin:'ศรีนครินทร์', Victory:'อนุสาวรีย์', Rama3:'พระราม 3'};
let BRANCH = BR_TH[QS.get('b')] ? QS.get('b') : null;
const BTH = () => BR_TH[BRANCH] || BR_TH.Srinakarin;
let PREP = QS.get('m')==='prep'; let RX = QS.get('m')==='rx'; let RXR = [], rxQ = ''; let RECV = QS.get('m')==='receive'; if (PREP) document.title = '① จัดยาใส่ถ้วย · U Well Care'; if (RX) document.title = 'รับยาจากญาติ · U Well Care'; if (RECV) document.title = '③ กระดานรับถ้วยยา · U Well Care'; const WEB = QS.get('k') ? {key:QS.get('k'), by:QS.get('by')||'', cup:QS.get('cup')||''} : null;
let NURSE = null, ME = null, NA = null, STAFF = [], cups = [], view = {screen:'list', tab:'รอตรวจ'}, work = null, busy = false, lastErr = '';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const fmt = n => n === 0.5 ? '½' : (n % 1 === 0.5 ? Math.floor(n) + '½' : String(n));

async function api(action, data){
  const auth = WEB ? {key:WEB.key, by:WEB.by} : {idToken: liff.getIDToken()};
  const r = await fetch(C.API_URL, {method:'POST', body: JSON.stringify(Object.assign({action, branch: BRANCH || 'Srinakarin'}, auth, data||{}))});
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'ระบบขัดข้อง');
  return j;
}
function loading(t){ $('app').innerHTML = `<div class="center"><div class="spin"></div>${t||'กำลังโหลด…'}</div>`; }
function head(title, sub, back){ return `<header>${back?'<button class="back" onclick="goList()" aria-label="กลับ">‹</button>':''}<h1>${title}<div class="sub">${sub||''}</div></h1>${ME?`<span class="me" ${RECV?'onclick="pickNA()" style="cursor:pointer"':''}>👤 ${esc(ME)}${RECV?' ▾':''}</span>`:''}</header>`; }
function modeBar(){ if (WEB) return ''; const T = (on, m, n, t, c) => `<button class="${c||''} ${on?'on':''}" onclick="setMode('${m}')"><b>${n}</b>${t}</button>`;
  return `<div class="brbar" onclick="changeBranch()">📍 <b>${esc(BTH())}</b> <span>เปลี่ยนสาขา ▾</span></div><div class="mtabs">${T(PREP&&!RX,'prep','①','จัดยา')}${T(!PREP&&!RX&&!RECV,'check','②','ตรวจนับ')}${T(RECV,'recv','③','รับถ้วย')}${T(RX,'rx','💊','ยาจากญาติ','rx')}</div>`; }
/* ---------- 0 · คู่มือการใช้งาน ---------- */
function showGuide(){
  const g = (icon, title, who, steps, tips) => `<div class="sec"><h2 style="margin:0 0 2px">${icon} ${title}</h2><p class="meta" style="margin:0 0 8px">${who}</p><ol style="margin:0;padding-left:20px;line-height:1.7">${steps.map(x=>`<li>${x}</li>`).join('')}</ol>${tips?`<div class="meta" style="margin-top:8px;background:#f6f8fb;border-radius:10px;padding:8px 10px;line-height:1.6">${tips}</div>`:''}</div>`;
  $('app').innerHTML = head('📖 คู่มือการใช้งาน', 'ระบบถ้วยยา · LINE') +
  `<div class="sec" style="background:#eef5fc;border-color:#cfe0f3"><b>ลำดับของแต่ละมื้อ</b><br>① พยาบาลคนที่ 1 จัดยาใส่ถ้วย → ② พยาบาลคนที่ 2 ตรวจนับ → ③ NA รับถ้วยไปให้ยา<br><span class="meta">💊 ยาจากญาติ (เติมยา · ยาใหม่ · หมอเปลี่ยนวิธีกิน) ทำได้ทุกเวลา แยกจากรอบถ้วย</span></div>
  <div class="sec"><h2 style="margin:0 0 6px">เริ่มใช้ครั้งแรก</h2><ol style="margin:0;padding-left:20px;line-height:1.7"><li>กดลิงก์ที่ปักหมุดในกลุ่ม RN</li><li>เลือกสาขา (เครื่องจะจำไว้ เปลี่ยนได้ที่แถบเหลือง 📍)</li><li>เลือกชื่อตัวเอง ทำครั้งเดียว ใช้ได้ทันที</li></ol><p class="meta" style="margin:8px 0 0">ถ้าไม่เจอชื่อตัวเอง หรือขึ้น "รอแอดมินอนุมัติ" แจ้งแอดมิน</p></div>` +
  g('①','จัดยาใส่ถ้วย','พยาบาลคนที่ 1',[
    'กด ① จัดยาใส่ถ้วย → เลือกคนไข้จากแท็บ <b>รอจัด</b> (เรียงตามมื้อ)',
    'ใส่ยาลงถ้วยตามจำนวนที่ขึ้น แล้ว<b>แตะติ๊กทีละตัว</b>',
    'กด 📷 ถ่ายรูปถ้วยหลังจัด (ถ่ายเฉพาะเม็ดยา ห้ามติดหน้าหรือชื่อคนไข้)',
    'กด <b>✅ จัดเสร็จ ส่งตรวจ</b> → กด <b>คนถัดไป</b> ได้เลย'],
    'แท็บ <b>ถูกส่งกลับ</b> = ถ้วยที่ตรวจแล้วนับไม่ตรง หรือ NA แจ้งว่าไม่ตรง ต้องจัดใหม่ก่อน<br>ยาที่เพิ่มในแอประบบยาระหว่างวัน จะเข้าถ้วยที่ยังไม่จัดเอง ภายในไม่กี่วินาทีหลังเปิดหน้านี้') +

function rxPhoto(inp){
  const f = inp.files && inp.files[0]; if (!f) return; const w = work;
  const img = new Image(); img.onload = () => {
    const s = Math.min(1, 1280/Math.max(img.width,img.height)); const cv = document.createElement('canvas');
    cv.width = Math.round(img.width*s); cv.height = Math.round(img.height*s); cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    const p = {thumb: cv.toDataURL('image/jpeg', 0.5), data: cv.toDataURL('image/jpeg', 0.75), file:null};
    w.photos.push(p); URL.revokeObjectURL(img.src); rxUp(p); renderRx();
  }; img.src = URL.createObjectURL(f);
}

  catch(e){ p.err = true; lastErr = 'ส่งรูปไม่สำเร็จ แตะถ่ายรูปใหม่อีกครั้ง'; w.photos = w.photos.filter(x=>x!==p); }

async function doRegister(){ try{ loading('กำลังส่ง…'); const r = await api('register',{staffId:regSel}); lastErr=''; if (r.status==='approved') return start(); showPending(r.name); }catch(e){ lastErr=e.message; showRegister(); } }
function showPending(name){
  $('app').innerHTML = head('รอแอดมินอนุมัติ','ตรวจนับถ้วยยา · ' + BTH()) +
  `<div class="sec"><div class="center" style="padding:16px 0"><div style="font-size:40px">⏳</div><p>ส่งคำขอในชื่อ <b>${esc(name)}</b> แล้ว<br>เมื่อแอดมินอนุมัติ กดปุ่มด้านล่างเพื่อเข้าใช้งาน</p></div>
  <button class="btn sec2" onclick="loading();start()">ตรวจสถานะอีกครั้ง</button></div>`;
}

/* ---------- รายการถ้วย ---------- */
async function loadList(){ if (RX) return rxLoad(); loading(); try{ const r = await api('list', PREP?{mode:'prep'}:RECV?{mode:'receive'}:{}); if (r.staff) STAFF = r.staff; cups = r.cups; lastErr=''; }catch(e){ lastErr = e.message; } renderList();  if (PREP) cupSync(); }
// ยาที่เพิ่มในแอประบบยาระหว่างวัน: สั่งเติมเข้าถ้วยที่ยังไม่จัดเบื้องหลัง แล้วโหลดรายชื่อใหม่ถ้ามีการเปลี่ยน
let syncAt = 0, syncing = false;
async function cupSync(){ if (syncing || Date.now()-syncAt < 45000) return; syncing = true; syncAt = Date.now();
  try{ const r = await api('cupSync'); if ((r.cups||r.filled) && PREP && view.screen==='list'){ const l = await api('list',{mode:'prep'}); if (PREP && view.screen==='list'){ cups = l.cups; renderList(); } } }catch(e){}
  syncing = false; }
function goList(){ if (RX){ work = null; if (RXR.length){ lastErr=''; renderRxList(); window.scrollTo(0,0); } else rxLoad(); return; } view = {screen:'list', tab:view.tab||(PREP?'รอจัด':RECV?'ตรวจแล้ว':'รอตรวจ')}; if ((PREP||RECV) && cups.length){ lastErr=''; renderList(); window.scrollTo(0,0); } else loadList(); }
function renderList(){ if (RX) return renderRxList(); if (PREP) return renderPrepList(); if (RECV) return renderRecvList();
  const n = s => cups.filter(c=>c.status===s).length;
  const items = cups.filter(c=>c.status===view.tab);
  let body = '', lastRound = '';
  items.forEach(c=>{
    if (c.round!==lastRound){ body += `<div class="round">มื้อ${esc(c.round)}</div>`; lastRound = c.round; }
    const tag = c.status==='ไม่ตรง' ? `<span class="pill bad">❌ ${esc(c.note||'นับไม่ตรง')}</span>` : c.status==='ตรวจแล้ว' ? `<span class="pill ok">✅ ตรวจโดย ${esc(c.checkBy)}</span>` : '';
    body += `<div class="cup ${c.status==='รอตรวจ'?'tap':''}" ${c.status==='รอตรวจ'?`onclick="openCup('${esc(c.id)}')"`:''}><div class="info">
      <div class="nm">${esc(c.name)}</div><div class="meta">ห้อง ${esc(c.room)} · ${esc(c.timing)} · ${c.drugs.length} ตัวยา${c.prepAt?' · จัด '+esc(c.prepAt)+' น.':''}</div>${tag}</div>
      ${phBtn(c)}${c.status==='รอตรวจ'?'<span class="chev">›</span>':''}</div>`;
  });
  if (!items.length) body = `<div class="empty">${view.tab==='รอตรวจ'?'ไม่มีถ้วยรอตรวจตอนนี้':'ไม่มีรายการ'}</div>`;
  $('app').innerHTML = head('② ตรวจนับถ้วยยา',BTH() + ' · วันนี้') + modeBar() + errBox() +
   `<div class="tabs">${['รอตรวจ','ไม่ตรง','ตรวจแล้ว'].map(t=>`<button class="tab ${view.tab===t?'on':''}" onclick="view.tab='${t}';renderList()">${t==='ไม่ตรง'?'ส่งกลับ':t} (${n(t)})</button>`).join('')}</div>
   <div class="list">${body}</div><div class="bottom"><button class="btn ghost" style="width:100%" onclick="loadList()">↻ โหลดใหม่</button></div>`;
}

/* ---------- หน้าตรวจ ---------- */
function openCup(id){ view = {screen:'check', cupId:id, tab:'รอตรวจ'}; work = {counts:{}, other:{}, photo:null, up:null, file:null, upErr:''}; renderCheck(true); }
function renderCheck(top){
  const c = cups.find(x=>x.id===view.cupId), y = window.scrollY;
  const preset = [0,0.5,1,2,3];
  const drugs = c.drugs.map(d=>{ const v = work.counts[d.id]; const isO = v!==undefined && !preset.includes(v);
    return `<div class="drug"><div class="dn">${esc(d.n)}</div>
     <div class="nums">${preset.map(p=>`<button class="nb ${v===p?'on':''}" onclick="setC('${esc(d.id)}',${p})">${fmt(p)}</button>`).join('')}
     <button class="nb ${isO||work.other[d.id]?'on':''}" onclick="togO('${esc(d.id)}')">${isO?fmt(v):'อื่น'}</button></div>
     <div class="other ${work.other[d.id]?'show':''}"><button class="step" onclick="stepC('${esc(d.id)}',-0.5)">−</button><span class="ov">${v===undefined?'–':fmt(v)}</span><button class="step" onclick="stepC('${esc(d.id)}',0.5)">+</button><span class="meta">ทีละ ½ เม็ด</span></div></div>`; }).join('');
  const left = c.drugs.filter(d=>work.counts[d.id]===undefined).length;
  const hint = [left?`ยังไม่ได้นับ ${left} ตัวยา`:'', !work.photo?'ยังไม่ถ่ายรูป':''].filter(Boolean).join(' · ');
  $('app').innerHTML = head(esc(c.name), `ห้อง ${esc(c.room)} · ${esc(c.round)} ${esc(c.timing)}`, true) + errBox() +
   `<div class="sec"><h2>นับเม็ดยาในถ้วยจริง แล้วแตะตัวเลข</h2>${drugs}</div>
    <div class="sec"><h2>รูปถ้วยตอนตรวจ</h2>${work.photo?`<img class="photo" src="${work.photo}" alt="รูปถ้วย">`:''}
     <label class="btn sec2">📷 ${work.photo?'ถ่ายใหม่':'ถ่ายรูป'}<input type="file" accept="image/*" capture="environment" style="display:none" onchange="gotPhoto(this)"></label>${photoState()}
     <div class="meta" style="margin-top:6px">ถ่ายเฉพาะเม็ดยาในถ้วย ห้ามติดหน้าหรือชื่อคนไข้</div></div>
    <div class="note">จำนวนที่ RN คนที่ 1 จัด จะเห็นหลังกดตรวจนับเสร็จ เพื่อให้นับเองจริง ๆ</div>
    <div class="bottom"><div class="hint">${hint}</div><button class="btn main" ${hint||busy?'disabled':''} onclick="askSubmit()">✅ ตรวจนับเสร็จ</button></div>`;
  window.scrollTo(0, top?0:y);
}
function setC(id,v){ work.counts[id]=v; work.other[id]=false; renderCheck(); }
function togO(id){ work.other[id]=!work.other[id]; if (work.other[id] && work.counts[id]===undefined) work.counts[id]=4; renderCheck(); }
function stepC(id,d){ work.counts[id]=Math.max(0,(work.counts[id]??4)+d); renderCheck(); }
function gotPhoto(inp){
  const f = inp.files && inp.files[0]; if (!f) return;
  const img = new Image(); img.onload = () => {
    const s = Math.min(1, 1024/Math.max(img.width,img.height)); const cv = document.createElement('canvas');
    cv.width = Math.round(img.width*s); cv.height = Math.round(img.height*s); cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    work.photo = cv.toDataURL('image/jpeg', 0.7); URL.revokeObjectURL(img.src); upload(); rerender();
  }; img.src = URL.createObjectURL(f);
}
// อัปโหลดรูปทันทีที่ถ่าย ระหว่างที่ยังนับยาอยู่ — ตอนกดตรวจนับเสร็จจะได้ไม่ต้องรอรูป
function upload(){
  const w = work, photo = w.photo; w.file = null; w.upErr = '';
  const p = api('photo', {cupId:view.cupId, photo, kind:w.kind||'check'}).then(r => { if (w.photo===photo){ w.file = r.file; } return r.file; })
    .catch(e => { if (w.photo===photo){ w.upErr = e.message; } throw e; })
    .finally(() => { if (work===w) rerender(); });
  w.up = p; p.catch(()=>{});
}
function photoState(){
  if (!work.photo) return '';
  if (work.file) return '<div class="meta" style="margin-top:6px;color:var(--ok)">✓ บันทึกรูปแล้ว</div>';
  if (work.upErr) return '<div class="meta" style="margin-top:6px;color:var(--bad)">อัปโหลดรูปไม่สำเร็จ จะลองใหม่ตอนกดตรวจนับเสร็จ</div>';
  return '<div class="meta" style="margin-top:6px">กำลังบันทึกรูป… นับยาต่อได้เลย</div>';
}
function isSolo(c){ const me = WEB ? WEB.by : ME; return !!c.prepBy && !!me && String(c.prepBy).trim() === String(me).trim(); }
function askSubmit(){
  const c = cups.find(x=>x.id===view.cupId);
  if (isSolo(c)) return askSolo();
  openModal(`<h3>ยืนยันตรวจนับเสร็จ?</h3><p>หลังยืนยันจะแก้ตัวเลขไม่ได้ ระบบจะเทียบกับที่ RN คนที่ 1 จัดทันที</p>
   <div class="acts"><button class="btn ghost" onclick="closeModal()">กลับไปนับ</button><button class="btn main" style="width:auto" onclick="closeModal();doSubmit()">ยืนยัน</button></div>`);
}
function askSolo(){
  openModal(`<h3>⚠️ คุณเป็นคนจัดถ้วยนี้เอง</h3><p>ปกติต้องให้พยาบาลอีกคนตรวจนับ ถ้าตอนนี้ทำงานคนเดียว กดยืนยันได้ ระบบจะติดป้าย <b>"ตรวจคนเดียว"</b> ไว้ที่ถ้วยนี้ ให้ NA และหัวหน้าเห็น</p>
   <p class="meta">นับใหม่อีกรอบให้ละเอียดก่อนยืนยัน</p>
   <div class="acts"><button class="btn ghost" onclick="closeModal()">กลับไปนับ</button><button class="btn main" style="width:auto;background:var(--warn)" onclick="closeModal();work.solo=true;doSubmit()">ยืนยัน ตรวจคนเดียว</button></div>`);
}
async function doSubmit(){
  const c = cups.find(x=>x.id===view.cupId); busy = true; loading(work.file ? 'กำลังบันทึกผล…' : 'กำลังบันทึกผลและรูป…');
  try{
    let file = work.file;
    if (!file && work.up){ try{ file = await work.up; }catch(e){ file = null; } }
    const base = {cupId:c.id, counts:work.counts, solo:!!work.solo};
    const r = await api('submit', file ? Object.assign(base,{photoFile:file}) : Object.assign(base,{photo:work.photo})); lastErr=''; busy=false;
    view = {screen:'result', cupId:c.id, tab:'รอตรวจ', r};
    renderResult(c, r); notifyChat(c, r);
  }catch(e){ busy=false; if (String(e.message).startsWith('SAME_PERSON')){ lastErr=''; renderCheck(true); return askSolo(); } lastErr = e.message; renderCheck(true); }
}
function renderResult(c, r){
  const rows = r.items.map(i=>`<tr class="${i.ok?'':'x'}"><td>${esc(i.n)}</td><td class="n">${fmt(i.prep)}</td><td class="n">${fmt(i.count)}${i.ok?'':' ❌'}</td></tr>`).join('');
  $('app').innerHTML = head(esc(c.name), `ห้อง ${esc(c.room)} · ${esc(c.round)} ${esc(c.timing)}`, true) +
   (r.match ? `<div class="res ok"><div class="big">✅</div><h2>นับตรงทุกตัวยา</h2><p>${fmt(r.total)} เม็ด · ส่งต่อให้ NA ได้</p></div>`
            : `<div class="res bad"><div class="big">❌</div><h2>นับไม่ตรง ${r.bad} ตัวยา</h2><p>RN จัด ${fmt(r.prepTotal)} เม็ด · คุณนับได้ ${fmt(r.total)} เม็ด</p><p><b>ห้ามส่งถ้วยนี้ให้ NA</b> ถ้วยถูกส่งกลับไปขั้นจัดยาแล้ว</p></div>`) +
   `<div class="sec"><h2>เทียบรายตัวยา</h2><table><tr><th>ยา</th><th style="text-align:center">RN จัด</th><th style="text-align:center">คุณนับ</th></tr>${rows}</table></div>
    ${work && work.solo ? '<div class="note" style="color:var(--warn)">⚠️ บันทึกเป็น "ตรวจคนเดียว" แล้ว</div>' : ''}<div class="note" id="chatnote"></div>
    <div class="bottom"><button class="btn main" style="background:var(--pri)" onclick="goList()">กลับหน้ารายการ</button></div>`;
}
async function notifyChat(c, r){
  // ส่งข้อความในนามพยาบาลเข้าห้องแชทที่เปิดหน้านี้ (ไม่กินโควตา OA) — ทำได้เฉพาะเปิดจากในแชท
  const note = $('chatnote');
  if (WEB){ if (note) note.textContent = 'บันทึกผลในระบบแล้ว · ปิดหน้านี้เพื่อกลับแอประบบยา'; return; }
  try{
    const ctx = liff.getContext();
    if (!ctx || !['group','room','utou'].includes(ctx.type)) { if (note) note.textContent = 'เปิดจากนอกห้องแชท จึงไม่ได้แจ้งในกลุ่ม'; return; }
    const txt = r.match ? `✅ ตรวจนับถ้วยแล้ว นับตรง\n${c.name} · ${c.round} ${c.timing}\nตรวจโดย ${ME}`
                        : `❌ นับไม่ตรง ${r.bad} ตัวยา ส่งกลับจัดใหม่\n${c.name} · ${c.round} ${c.timing}\n${r.items.filter(i=>!i.ok).map(i=>`${i.n}: จัด ${fmt(i.prep)} / นับ ${fmt(i.count)}`).join('\n')}\nห้ามส่งให้ NA · ตรวจโดย ${ME}`;
    await liff.sendMessages([{type:'text', text:txt}]);
    if (note) note.textContent = 'แจ้งผลในกลุ่ม LINE แล้ว';
  }catch(e){ if (note) note.textContent = 'แจ้งในกลุ่มไม่สำเร็จ (บันทึกผลในระบบแล้ว)'; }
}

/* ---------- โหมดจัดยา (RN คนที่ 1) ---------- */
function renderPrepList(){
  const n = s => cups.filter(c=>c.status===s).length;
  const items = cups.filter(c=>c.status===view.tab); const can = s => s==='รอจัด'||s==='ไม่ตรง';
  let body = '', lastRound = '';
  items.forEach(c=>{
    if (c.round!==lastRound){ body += `<div class="round">มื้อ${esc(c.round)}</div>`; lastRound = c.round; }
    const tag = c.status==='ไม่ตรง' ? `<span class="pill bad">❌ ตรวจนับไม่ตรง ต้องจัดใหม่</span>` : c.status==='รอตรวจ' ? `<span class="pill ok">ส่งตรวจแล้ว${c.prepAt?' '+esc(c.prepAt)+' น.':''}</span>` : '';
    body += `<div class="cup ${can(c.status)?'tap':''}" ${can(c.status)?`onclick="openPrep('${esc(c.id)}')"`:''}><div class="info">
      <div class="nm">${esc(c.name)}</div><div class="meta">ห้อง ${esc(c.room)} · ${esc(c.timing)} · ${c.drugs.length} ตัวยา</div>${tag}</div>
      ${phBtn(c)}${can(c.status)?'<span class="chev">›</span>':''}</div>`;
  });
  if (!items.length) body = `<div class="empty">ไม่มีรายการ</div>`;
  $('app').innerHTML = head('① จัดยาใส่ถ้วย',BTH() + ' · วันนี้') + modeBar() + errBox() +
   `<div class="tabs">${['รอจัด','ไม่ตรง','รอตรวจ'].map(t=>`<button class="tab ${view.tab===t?'on':''}" onclick="view.tab='${t}';renderList()">${t==='ไม่ตรง'?'ถูกส่งกลับ':t==='รอตรวจ'?'ส่งตรวจแล้ว':t} (${n(t)})</button>`).join('')}</div>
   <div class="list">${body}</div><div class="bottom"><button class="btn ghost" style="width:100%" onclick="loadList()">↻ โหลดใหม่</button></div>`;
}
function openPrep(id){ view = {screen:'prep', cupId:id, tab:view.tab||'รอจัด'}; work = {done:{}, photo:null, up:null, file:null, upErr:'', kind:'prep'}; renderPrep(true); }
function renderPrep(top){
  const c = cups.find(x=>x.id===view.cupId), y = window.scrollY;
  const drugs = c.drugs.map(d=>`<div class="pd ${work.done[d.id]?'on':''}" onclick="work.done['${esc(d.id)}']=!work.done['${esc(d.id)}'];renderPrep()">
     <div class="q">${fmt(d.q)}<small>เม็ด</small></div><div class="t"><div class="dn">${esc(d.n)}</div>
     ${d.bad?`<span class="fix">ตรวจนับได้ ${d.c===null?'–':fmt(d.c)} เม็ด · ต้องเป็น ${fmt(d.q)} เม็ด</span>`:''}</div><div class="ck">✓</div></div>`).join('');
  const left = c.drugs.filter(d=>!work.done[d.id]).length;
  const hint = [left?`ยังไม่ได้ติ๊ก ${left} ตัวยา`:'', !work.photo?'ยังไม่ถ่ายรูป':''].filter(Boolean).join(' · ');
  $('app').innerHTML = head(esc(c.name), `ห้อง ${esc(c.room)} · ${esc(c.round)} ${esc(c.timing)}`, true) + errBox() +
   (c.status==='ไม่ตรง' ? `<div class="err">❌ ถ้วยนี้ถูกส่งกลับ ${c.drugs.some(d=>d.bad) ? 'ตรวจนับไม่ตรง ' + c.drugs.filter(d=>d.bad).length + ' ตัวยา (ดูช่องสีแดง)' : esc(c.note||'')}${c.checkBy?' · ตรวจโดย '+esc(String(c.checkBy).split('@')[0]):''}<br>แก้ยาในถ้วยให้ตรงจำนวน แล้วถ่ายรูปใหม่</div>` : '') +
   `<div class="sec"><h2>ใส่ยาตามจำนวน แล้วแตะติ๊กทีละตัว</h2>${drugs}</div>
    <div class="sec"><h2>รูปถ้วยหลังจัด</h2>${work.photo?`<img class="photo" src="${work.photo}" alt="รูปถ้วย">`:''}
     <label class="btn sec2">📷 ${work.photo?'ถ่ายใหม่':'ถ่ายรูป'}<input type="file" accept="image/*" capture="environment" style="display:none" onchange="gotPhoto(this)"></label>${photoState()}
     <div class="meta" style="margin-top:6px">ถ่ายเฉพาะเม็ดยาในถ้วย ห้ามติดหน้าหรือชื่อคนไข้</div></div>
    <div class="bottom"><div class="hint">${hint}</div><button class="btn main" ${hint||busy?'disabled':''} onclick="doPrep()">✅ จัดเสร็จ ส่งตรวจ</button></div>`;
  window.scrollTo(0, top?0:y);
}
async function doPrep(){
  const c = cups.find(x=>x.id===view.cupId); busy = true; loading(work.file ? 'กำลังส่งตรวจ…' : 'กำลังบันทึกรูปและส่งตรวจ…');
  try{
    let file = work.file;
    if (!file && work.up){ try{ file = await work.up; }catch(e){ file = null; } }
    const r = await api('prepDone', file ? {cupId:c.id, photoFile:file} : {cupId:c.id, photo:work.photo}); lastErr=''; busy=false;
    c.status = 'รอตรวจ'; c.prepAt = new Date().toTimeString().slice(0,5);
    const nx = nextPrep(c.id);
    view = {screen:'done', cupId:c.id, tab:view.tab||'รอจัด'};
    $('app').innerHTML = head(esc(c.name), `ห้อง ${esc(c.room)} · ${esc(c.round)} ${esc(c.timing)}`, true) +
      `<div class="res ok"><div class="big">📤</div><h2>ส่งตรวจแล้ว</h2><p>${c.drugs.length} ตัวยา · ${fmt(r.total)} เม็ด</p><p>${WEB ? 'ให้ RN อีกคนตรวจนับในเมนู 2️⃣' : 'ให้ RN อีกคนตรวจนับ (แท็บ 🔍 ตรวจนับ)'}</p></div>
       <div class="note">${nx ? 'เหลือรอจัดอีก ' + cups.filter(x=>x.status==='รอจัด'||x.status==='ไม่ตรง').length + ' ถ้วย' : '🎉 จัดครบทุกถ้วยแล้ว'}</div>
       <div class="bottom">${nx ? `<button class="btn main" onclick="openPrep('${esc(nx.id)}')">➡️ คนถัดไป: ${esc(nx.name)} · ${esc(nx.round)}</button>
        <button class="btn ghost" style="width:100%;margin-top:8px" onclick="goList()">กลับหน้ารายชื่อ</button>`
        : `<button class="btn main" style="background:var(--pri)" onclick="goList()">กลับหน้ารายชื่อ</button>`}</div>`;
  }catch(e){ busy=false; lastErr = e.message; renderPrep(true); }
}
function nextPrep(id){
  const open = x => x.status==='รอจัด' || x.status==='ไม่ตรง';
  const i = cups.findIndex(x=>x.id===id);
  const after = cups.slice(i+1).concat(cups.slice(0, Math.max(i,0)));
  return after.find(x=>x.status==='ไม่ตรง') || after.find(open) || null;
}

/* ---------- โหมด NA รับถ้วย (กระดานรับถ้วยยา) ---------- */
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function pickNA(){
  const na = STAFF.filter(s=>s.p==='NA'), other = STAFF.filter(s=>s.p!=='NA');
  const btns = a => a.map(s=>`<button class="${NA===s.n?'on':''}" onclick="setNA('${esc(s.n).replace(/'/g,"\\'")}')">${esc(s.n)}</button>`).join('');
  openModal(`<h3>เลือกชื่อผู้รับถ้วย</h3><p class="meta" style="margin:0 0 10px">ชื่อจากรายชื่อพนักงานในแอปสาขา · เครื่องนี้จะจำไว้</p>
    <div style="max-height:55vh;overflow:auto"><div class="names">${btns(na)}</div>${other.length?`<div class="round" style="margin:12px 2px 6px">ตำแหน่งอื่น</div><div class="names">${btns(other)}</div>`:''}</div>
    ${NA?'<div class="acts"><button class="btn ghost" onclick="closeModal()">ปิด</button></div>':''}`);
}
function setNA(n){ NA = n; ME = n; lsSet('uwc_na_' + BRANCH, n); closeModal(); if (view.screen==='recv') renderRecv(); else renderList(); }
function renderRecvList(){
  const n = s => cups.filter(c=>c.status===s).length;
  const items = cups.filter(c=>c.status===view.tab);
  let body = '', lastRound = '';
  items.forEach(c=>{
    if (c.round!==lastRound){ body += `<div class="round">มื้อ${esc(c.round)}</div>`; lastRound = c.round; }
    const can = c.status==='ตรวจแล้ว';
    const solo = c.solo ? `<span class="pill" style="background:var(--warn-bg);color:var(--warn)">⚠️ พยาบาลตรวจคนเดียว</span> ` : '';
    const tag = solo + (c.status==='รับแล้ว' ? `<span class="pill ok">✅ รับโดย ${esc(c.receiveBy)}${c.receiveAt?' '+esc(c.receiveAt)+' น.':''}</span>` : '');
    body += `<div class="cup ${can?'tap':''}" ${can?`onclick="openRecv('${esc(c.id)}')"`:''}><div class="info">
      <div class="nm">${esc(c.name)}</div><div class="meta">ห้อง ${esc(c.room)} · ${esc(c.timing)} · ${c.drugs.length} ตัวยา · ${fmt(c.drugs.reduce((a,d)=>a+d.q,0))} เม็ด</div>${tag}</div>
      ${phBtn(c)}${can?'<span class="chev">›</span>':''}</div>`;
  });
  if (!items.length) body = `<div class="empty">${view.tab==='ตรวจแล้ว'?'ยังไม่มีถ้วยที่พยาบาลตรวจเสร็จ':'ไม่มีรายการ'}</div>`;
  $('app').innerHTML = head('③ กระดานรับถ้วยยา',BTH() + ' · วันนี้') + modeBar() + errBox() +
   `<div class="tabs">${['ตรวจแล้ว','รับแล้ว'].map(t=>`<button class="tab ${view.tab===t?'on':''}" onclick="view.tab='${t}';renderList()">${t==='ตรวจแล้ว'?'รอรับ':t} (${n(t)})</button>`).join('')}</div>
   <div class="list">${body}</div><div class="bottom"><button class="btn ghost" style="width:100%" onclick="loadList()">↻ โหลดใหม่</button></div>`;
}
function openRecv(id){ if (!NA) return pickNA(); view = {screen:'recv', cupId:id, tab:'ตรวจแล้ว'}; work = {done:{}, photo:null, up:null, file:null, upErr:'', kind:'receive'}; renderRecv(true); }
function renderRecv(top){
  const c = cups.find(x=>x.id===view.cupId), y = window.scrollY;
  const drugs = c.drugs.map(d=>`<div class="pd ${work.done[d.id]?'on':''}" onclick="work.done['${esc(d.id)}']=!work.done['${esc(d.id)}'];renderRecv()">
     <div class="q">${fmt(d.q)}<small>เม็ด</small></div><div class="t"><div class="dn">${esc(d.n)}</div></div><div class="ck">✓</div></div>`).join('');
  const left = c.drugs.filter(d=>!work.done[d.id]).length;
  const hint = [left?`ยังไม่ได้ติ๊ก ${left} ตัวยา`:'', !work.photo?'ยังไม่ถ่ายรูป':''].filter(Boolean).join(' · ');
  $('app').innerHTML = head(esc(c.name), `ห้อง ${esc(c.room)} · ${esc(c.round)} ${esc(c.timing)}`, true) + errBox() +
   `<div class="sec"><h2>ดูยาในถ้วยว่าตรงกับรายการ แล้วแตะติ๊กทีละตัว</h2>${drugs}
     ${c.solo?'<div class="err" style="margin:10px 0 0">⚠️ ถ้วยนี้พยาบาลจัดและตรวจคนเดียว ดูยาให้ละเอียดเป็นพิเศษ</div>':''}
     <div class="meta" style="margin-top:8px">รวม ${fmt(c.drugs.reduce((a,d)=>a+d.q,0))} เม็ด · พยาบาลตรวจแล้ว${c.checkBy?' ('+esc(String(c.checkBy).split('@')[0])+')':''}</div></div>
    <div class="sec"><h2>รูปถ้วยตอนรับ</h2>${work.photo?`<img class="photo" src="${work.photo}" alt="รูปถ้วย">`:''}
     <label class="btn sec2">📷 ${work.photo?'ถ่ายใหม่':'ถ่ายรูป'}<input type="file" accept="image/*" capture="environment" style="display:none" onchange="gotPhoto(this)"></label>${photoState()}</div>
    <div class="bottom"><div class="hint">${hint}</div>
     <button class="btn main" ${hint||busy?'disabled':''} onclick="doRecv(true)">✅ รับถ้วยแล้ว</button>
     <button class="btn ghost" style="width:100%;margin-top:8px;color:var(--bad)" ${!work.photo||busy?'disabled':''} onclick="askBad()">⚠️ ยาไม่ตรง แจ้งพยาบาล</button></div>`;
  window.scrollTo(0, top?0:y);
}
function askBad(){
  openModal(`<h3>ยาในถ้วยไม่ตรง?</h3><p>ถ้วยจะถูกส่งกลับให้พยาบาลจัดใหม่ <b>ห้ามให้ยาจากถ้วยนี้</b></p>
   <textarea id="badnote" rows="3" style="width:100%;font:inherit;padding:8px;border-radius:10px;border:1.5px solid var(--line)" placeholder="บอกสั้น ๆ เช่น เม็ดขาวขาด 1 เม็ด"></textarea>
   <div class="acts"><button class="btn ghost" onclick="closeModal()">ยกเลิก</button><button class="btn main" style="width:auto;background:var(--bad)" onclick="const t=$('badnote').value;closeModal();doRecv(false,t)">ส่งกลับ</button></div>`);
}
async function doRecv(ok, note){
  const c = cups.find(x=>x.id===view.cupId); busy = true; loading('กำลังบันทึก…');
  try{
    let file = work.file;
    if (!file && work.up){ try{ file = await work.up; }catch(e){ file = null; } }
    const base = {cupId:c.id, ok:!!ok, note:note||'', na:NA};
    await api('receive', file ? Object.assign(base,{photoFile:file}) : Object.assign(base,{photo:work.photo})); lastErr=''; busy=false;
    c.status = ok ? 'รับแล้ว' : 'ไม่ตรง'; c.receiveBy = NA; c.receiveAt = new Date().toTimeString().slice(0,5);
    if (!ok) cups = cups.filter(x=>x.id!==c.id);
    const nx = cups.find(x=>x.status==='ตรวจแล้ว' && x.round===c.round) || cups.find(x=>x.status==='ตรวจแล้ว');
    view = {screen:'done', cupId:c.id, tab:'ตรวจแล้ว'};
    $('app').innerHTML = head(esc(c.name), `ห้อง ${esc(c.room)} · ${esc(c.round)} ${esc(c.timing)}`, true) +
      (ok ? `<div class="res ok"><div class="big">✅</div><h2>รับถ้วยแล้ว</h2><p>ไปให้ยาได้เลย แล้วบันทึกในข้อ 6 ตามปกติ</p></div>`
          : `<div class="res bad"><div class="big">↩️</div><h2>ส่งกลับให้พยาบาลแล้ว</h2><p><b>ห้ามให้ยาจากถ้วยนี้</b> รอพยาบาลจัดใหม่</p></div>`) +
      `<div class="bottom">${nx ? `<button class="btn main" onclick="openRecv('${esc(nx.id)}')">➡️ ถ้วยถัดไป: ${esc(nx.name)} · ${esc(nx.round)}</button>
        <button class="btn ghost" style="width:100%;margin-top:8px" onclick="goList()">กลับกระดาน</button>`
        : `<button class="btn main" style="background:var(--pri)" onclick="goList()">กลับกระดาน</button>`}</div>`;
  }catch(e){ busy=false; lastErr = e.message; renderRecv(true); }
}
function rerender(){ if (view.screen==='recv') return renderRecv(); if (view.screen==='prep') renderPrep(); else if (view.screen==='check') renderCheck(); }
function openModal(h){ $('sheet').innerHTML = h; $('modal').classList.add('show'); }
function closeModal(){ $('modal').classList.remove('show'); }
start();
</script>
